plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.soundtransferlower'
    compileSdk 34

    defaultConfig {
        applicationId 'com.am.papertape'
        minSdk 15
        targetSdk 33
        versionCode 29
        versionName "2.9.3fix"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 添加打包选项解决重复文件错误
        packagingOptions {
            exclude 'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version'
            // 排除其他可能重复的文件
            exclude 'META-INF/*.version'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // NOTE: Concentus Opus (纯 Java Opus 编解码器) 不在 Maven Central 上，请手动将
    // ConcentusOpus.jar 放入 app/libs/ 目录，fileTree 会自动引入。
    // 来源: https://github.com/concentus/Concentus
    implementation 'com.android.support:appcompat-v7:24.0.0'
    implementation 'com.android.support:design:24.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
