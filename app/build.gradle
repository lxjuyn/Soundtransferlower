plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.soundtransferlower'
    compileSdk 35

    defaultConfig {
        applicationId 'com.am.papertape'
        // 同步上游 3.0.0beta1 的功能，保留我们的现代化目标平台（AndroidX / minSdk 15 / targetSdk 34）
        minSdk 15
        targetSdk 34
        versionCode 30
        versionName "3.0.0beta1-md3"
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 添加打包选项解决重复文件错误
        packagingOptions {
            exclude 'META-INF/androidx.localbroadcastmanager_localbroadcastmanager.version'
            // 排除其他可能重复的文件
            exclude 'META-INF/*.version'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // NOTE: Concentus Opus (纯 Java Opus 编解码器) 不在 Maven Central 上，请手动将
    // ConcentusOpus.jar 放入 app/libs/ 目录，fileTree 会自动引入。
    // 来源: https://github.com/concentus/Concentus
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // WorkManager: 闹钟失败时的备用保活机制
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
